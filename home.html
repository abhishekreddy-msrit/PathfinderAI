<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects & Tasks</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="style_home.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" xintegrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

  <header class="py-3 mb-4 mr-0 border-bottom">
    <div class="container d-flex justify-content-between align-items-center">
      <img src="https://upload.wikimedia.org/wikipedia/commons/b/b2/Bootstrap_logo.svg" alt="Logo" width="50" height="50">
      <button onclick="handleLogout()" class="btn btn-outline-danger">Logout</button>
    </div>
  </header>

  <div class="d-flex justify-content-center">
    <div class="input-group mb-4" style="max-width: 500px; width: 100%;">
      <input type="text" id="searchInput" class="form-control" placeholder="Search subjects or topics...">
      <button class="btn btn-primary" onclick="searchSubjects()">Search</button>
    </div>
  </div>

  <div class="d-flex justify-content-center">
    <div id="searchResults" style="max-width: 600px; width: 100%;"></div>
  </div>

  <div class="container">
    <div class="row">
      
      <div class="col-md-6 mb-5">
         <h2 class="mb-3 border-bottom pb-2">Your Subjects</h2>
         
         <div class="accordion" id="accordionExample">
            <div class="text-center mt-3 text-muted">Loading subjects...</div>
         </div>

         <div class="mt-4 add_subj">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addSubjectModal">
                <i class="fa-solid fa-plus"></i> Add Subject
            </button>
         </div>
      </div>

      <div class="col-md-6 mb-5">
        <h2 class="mb-3 border-bottom pb-2">Tasks & Reminders</h2>
        
        <div class="card p-3 bg-light border-0">
            <div class="input-group mb-3">
                <input type="text" id="taskInput" class="form-control" placeholder="Add a new task...">
                <button class="btn btn-success" onclick="addTask()">
                    <i class="fa-solid fa-check"></i>
                </button>
            </div>

            <ul class="list-group" id="taskList">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Review Graph Theory notes
                    <button class="btn btn-sm btn-outline-danger" onclick="this.parentElement.remove()">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </li>
            </ul>
        </div>
      </div>

    </div>
  </div>

  <!-- ADD SUBJECT MODAL -->
  <div class="modal fade" id="addSubjectModal" tabindex="-1" aria-labelledby="addSubjectModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addSubjectModalLabel">Add New Subject</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="subjectForm">
            <div class="mb-3">
              <label for="subjectNameInput" class="form-label">Subject Name</label>
              <input type="text" class="form-control" id="subjectNameInput" placeholder="e.g. Web Development" required>
            </div>
            <div class="mb-3">
              <label for="subjectTopicsInput" class="form-label">Description / Topics</label>
              <input type="text" class="form-control" id="subjectTopicsInput" placeholder="e.g. HTML, CSS, JavaScript" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" id="saveSubjectBtn">Save Subject</button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- EDIT SUBJECT MODAL (ADDED) -->
  <div class="modal fade" id="editSubjectModal" tabindex="-1" aria-labelledby="editSubjectModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editSubjectModalLabel">Edit Subject</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Hidden input to store the Subject ID -->
          <input type="hidden" id="editSubjectId">
          
          <div class="mb-3">
            <label class="form-label">Subject Name</label>
            <input type="text" id="editSubjectNameInput" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description / Topics</label>
            <input type="text" id="editSubjectTopicsInput" class="form-control" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" id="updateSubjectBtn">Update Subject</button>
        </div>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  
  <script>
    // --- GLOBAL STATE ---
    let subjects = []; 

    // --- 1. LOAD SUBJECTS (READ) ---
    document.addEventListener('DOMContentLoaded', fetchSubjects);

    async function fetchSubjects() {
        try {
            const response = await fetch('http://127.0.0.1:8000/subjects', {
                credentials: 'include' 
            });
            
            if (response.status === 401) {
                alert("Session expired. Please login again.");
                window.location.href = "login.html";
                return;
            }

            subjects = await response.json();
            renderSubjects();

        } catch (error) {
            console.error("Error fetching subjects:", error);
            document.getElementById("accordionExample").innerHTML = '<div class="alert alert-danger">Error loading data. Is the backend running?</div>';
        }
    }

    function renderSubjects() {
        const accordion = document.getElementById("accordionExample");
        accordion.innerHTML = "";

        if (subjects.length === 0) {
            accordion.innerHTML = '<div class="text-muted">No subjects found. Add one!</div>';
            return;
        }

        subjects.forEach((subj, index) => {
            // NOTE: subj._id is the MongoDB ID used for Delete/Update
            const topicsList = subj.description ? subj.description.split(',') : ["No description"];

            accordion.innerHTML += `
              <div class="accordion-item">
                <h2 class="accordion-header">
                  <button class="accordion-button collapsed" type="button"
                          data-bs-toggle="collapse" data-bs-target="#collapse${index}">
                    ${subj.name}
                  </button>
                </h2>

                <div id="collapse${index}" class="accordion-collapse collapse">
                  <div class="accordion-body">
                    <strong>Topics/Description:</strong>
                    <ul>
                      ${topicsList.map(t => `<li>${t.trim()}</li>`).join("")}
                    </ul>
                    
                    <!-- EDIT BUTTON: Now calls the real openEditModal function -->
                    <button class="btn btn-warning btn-sm mt-2 me-2" onclick="openEditModal('${subj._id}', '${subj.name}', '${subj.description}')">
                        <i class="fa-solid fa-pen"></i> Edit
                    </button>
                    
                    <!-- DELETE BUTTON: Now calls the real deleteSubject function -->
                    <button class="btn btn-danger btn-sm mt-2" onclick="deleteSubject('${subj._id}')">
                        <i class="fa-solid fa-trash"></i> Delete
                    </button>
                  </div>
                </div>
              </div>
            `;
        });
    }

    // --- NEW: DELETE SUBJECT (DELETE) ---
    async function deleteSubject(subjectId) {
        if (!confirm("Are you sure you want to delete this subject?")) return;

        try {
            const response = await fetch(`http://127.0.0.1:8000/subjects/${subjectId}`, {
                method: 'DELETE',
                credentials: 'include'
            });

            if (response.ok) {
                // Check if the body contains a successful message (200 OK)
                alert("Subject deleted successfully.");
                await fetchSubjects(); // Refresh the list from the server
            } else if (response.status === 404) {
                alert("Error: Subject not found or ownership mismatch.");
            } else {
                alert("Failed to delete subject.");
            }
        } catch (error) {
            console.error("Delete failed:", error);
            alert("Network error: Could not connect to backend.");
        }
    }
    
    // --- NEW: OPEN EDIT MODAL ---
    function openEditModal(subjectId, currentName, currentDescription) {
        // Populate modal fields
        document.getElementById("editSubjectId").value = subjectId;
        document.getElementById("editSubjectNameInput").value = currentName;
        document.getElementById("editSubjectTopicsInput").value = currentDescription;

        // Show the modal
        const editModal = new bootstrap.Modal(document.getElementById("editSubjectModal"));
        editModal.show();
    }

    // --- NEW: UPDATE SUBJECT (PUT) ---
    document.getElementById("updateSubjectBtn").addEventListener("click", async function () {
        const subjectId = document.getElementById("editSubjectId").value;
        const name = document.getElementById("editSubjectNameInput").value.trim();
        const description = document.getElementById("editSubjectTopicsInput").value.trim();

        if (!name) return alert("Subject name required");

        const payload = { name: name, description: description };

        try {
            const response = await fetch(`http://127.0.0.1:8000/subjects/${subjectId}`, {
                method: 'PUT',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                alert("Subject updated successfully.");
                await fetchSubjects(); // Refresh the list
                
                // Close the modal
                const modal = bootstrap.Modal.getInstance(document.getElementById("editSubjectModal"));
                modal.hide();
            } else {
                alert("Failed to update subject. Check server logs.");
            }
        } catch (error) {
            console.error("Update failed:", error);
            alert("Network error: Could not connect to backend.");
        }
    });


    // --- 2. ADD NEW SUBJECT (CREATE) ---
    document.getElementById("saveSubjectBtn").addEventListener("click", async function () {
        const name = document.getElementById("subjectNameInput").value.trim();
        const description = document.getElementById("subjectTopicsInput").value.trim();

        if (!name) return alert("Subject name required");

        const payload = { name: name, description: description };

        try {
            const response = await fetch('http://127.0.0.1:8000/subjects', {
                method: 'POST',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                await fetchSubjects();
                document.getElementById("subjectForm").reset();
                const modal = bootstrap.Modal.getInstance(document.getElementById("addSubjectModal"));
                modal.hide();
            } else {
                alert("Failed to add subject.");
            }
        } catch (error) {
            console.error("Error saving subject:", error);
            alert("Backend error.");
        }
    });

    // --- 3. SEARCH LOGIC (Client-side filtering) ---
    function searchSubjects() {
        const query = document.getElementById("searchInput").value.trim().toLowerCase();
        const resultDiv = document.getElementById("searchResults");

        if (query === "") {
            resultDiv.innerHTML = "";
            return;
        }

        let results = [];
        subjects.forEach(sub => {
            if (sub.name.toLowerCase().includes(query)) {
                results.push({ subject: sub.name, match: "Subject Name" });
            }
            if (sub.description && sub.description.toLowerCase().includes(query)) {
                results.push({ subject: sub.name, match: "Topics/Description" });
            }
        });

        resultDiv.innerHTML = "";
        if (results.length === 0) {
            resultDiv.innerHTML = `<div class="alert alert-danger mt-2">No results for "<strong>${query}</strong>"</div>`;
            return;
        }

        let html = `<div class="alert alert-info mt-2"><strong>Found in:</strong><ul class="mt-2 mb-0">` +
                   results.map(r => `<li><strong>${r.subject}</strong> (${r.match})</li>`).join("") +
                   `</ul></div>`;
        resultDiv.innerHTML = html;
    }

    // --- 4. LOGOUT LOGIC ---
    async function handleLogout() {
        await fetch('http://127.0.0.1:8000/logout', { method: 'POST', credentials: 'include' });
        window.location.href = 'login.html';
    }

    // --- TASK MANAGER (Local Only for now) ---
    function addTask() {
        const input = document.getElementById("taskInput");
        const taskText = input.value.trim();
        if (taskText === "") return alert("Please enter a task!");

        const list = document.getElementById("taskList");
        const li = document.createElement("li");
        li.className = "list-group-item d-flex justify-content-between align-items-center";
        
        li.innerHTML = `
            <span>${taskText}</span>
            <button class="btn btn-sm btn-outline-danger" onclick="this.parentElement.remove()">
                <i class="fa-solid fa-trash"></i>
            </button>
        `;

        list.appendChild(li);
        input.value = ""; 
    }

    document.getElementById("taskInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") addTask();
    });

  </script>

</body>
</html>
