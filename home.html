<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="style_home.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
      <header class="py-3 mb-4 mr-0 border-bottom">
        <div class="container d-flex justify-content-between align-items-center">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b2/Bootstrap_logo.svg" alt="Logo" width="50" height="50">
    </div>
  </header>

  <div class="d-flex justify-content-center">
  <div class="input-group mb-4" style="max-width: 500px; width: 100%;">
    <input type="text" id="searchInput" class="form-control" placeholder="Search subjects or topics...">
    <button class="btn btn-primary" onclick="searchSubjects()">Search</button>
  </div>
</div>


<div class="d-flex justify-content-center">
  <div id="searchResults" style="max-width: 600px; width: 100%;"></div>
</div>



     <div class="container">
         <h2>Your Subjects</h2>
         <div class="accordion" id="accordionExample">
          
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                Data Structures and Algorithms
              </button>
            </h2>
            <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
              <div class="accordion-body">
                <ul>
                  <li>Arrays</li>
                  <li>Linked Lists</li>
                  <li>Trees</li>
                  <li>Graphs</li>
                </ul>
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                 Java Programming
              </button>
            </h2>
            <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
              <div class="accordion-body">
                <ul>
                  <li>OOP Concepts</li>
                  <li>Classes</li>
                  <li>Interfaces</li>
                  <li>Exception Handling</li>
                </ul>
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                 Discrete Mathematics
              </button>
            </h2>
            <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
              <div class="accordion-body">
                <ul>
                  <li>Laws of Logic</li>
                  <li>Combinatorics</li>
                  <li>Graph Theory</li>
                </ul>
              </div>
            </div>
          </div>

        </div>
    </div>
        
      <div class="text-center mt-5 add_subj">
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addSubjectModal">
        <i class="fa-solid fa-plus"></i> Add Subject
    </button>
  </div>

  <div class="modal fade" id="addSubjectModal" tabindex="-1" aria-labelledby="addSubjectModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addSubjectModalLabel">Add New Subject</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="subjectForm">
          <div class="mb-3">
            <label for="subjectNameInput" class="form-label">Subject Name</label>
            <input type="text" class="form-control" id="subjectNameInput" placeholder="e.g. Web Development" required>
          </div>
          <div class="mb-3">
            <label for="subjectTopicsInput" class="form-label">Topics (separated by comma)</label>
            <input type="text" class="form-control" id="subjectTopicsInput" placeholder="e.g. HTML, CSS, JavaScript" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" id="saveSubjectBtn">Save Subject</button>
      </div>
    </div>
  </div>
</div>

  <!-- EDIT SUBJECT MODAL -->
<div class="modal fade" id="editSubjectModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Edit Subject</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="editSubjectId">

        <div class="mb-3">
          <label class="form-label">Subject Name</label>
          <input type="text" id="editSubjectNameInput" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Topics (comma separated)</label>
          <input type="text" id="editSubjectTopicsInput" class="form-control">
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button class="btn btn-primary" id="updateSubjectBtn">Update</button>
      </div>

    </div>
  </div>
</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
  // Temporary data (Replace with DB data later)
  let subjects = [
      {
          id: 1,
          name: "Data Structures and Algorithms",
          topics: ["Arrays", "Linked Lists", "Trees", "Graphs"]
      },
      {
          id: 2,
          name: "Java Programming",
          topics: ["OOP Concepts", "Classes", "Interfaces", "Exception Handling"]
      },
      {
          id: 3,
          name: "Discrete Mathematics",
          topics: ["Laws of Logic", "Combinatorics", "Graph Theory"]
      }
  ];

  // RENDER SUBJECT LIST
  function renderSubjects() {
      const accordion = document.getElementById("accordionExample");
      accordion.innerHTML = "";

      subjects.forEach((subj, index) => {
          accordion.innerHTML += `
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed" type="button"
                        data-bs-toggle="collapse" data-bs-target="#collapse${subj.id}">
                  ${subj.name}
                </button>
              </h2>

              <div id="collapse${subj.id}" class="accordion-collapse collapse">
                <div class="accordion-body">
                  <ul>
                    ${subj.topics.map(t => `<li>${t}</li>`).join("")}
                  </ul>

                  <button class="btn btn-warning btn-sm mt-2"
                      onclick="openEditModal(${subj.id})">
                      <i class="fa-solid fa-pen"></i> Edit
                  </button>

                  <button class="btn btn-danger btn-sm mt-2"
                      onclick="deleteSubject(${subj.id})">
                      <i class="fa-solid fa-trash"></i> Delete
                  </button>
                </div>
              </div>
            </div>
          `;
      });
  }

  renderSubjects();


  // ADD NEW SUBJECT
  document.getElementById("saveSubjectBtn").addEventListener("click", function () {
      const name = document.getElementById("subjectNameInput").value.trim();
      const topics = document.getElementById("subjectTopicsInput").value.trim().split(",");

      if (!name) return alert("Subject name required");

      subjects.push({
          id: Date.now(),
          name: name,
          topics: topics.map(t => t.trim())
      });

      renderSubjects();
      document.getElementById("subjectForm").reset();

      const modal = bootstrap.Modal.getInstance(document.getElementById("addSubjectModal"));
      modal.hide();

      console.log("CREATE → send POST to backend here");
  });


  // EDIT SUBJECT (OPEN MODAL)
  function openEditModal(id) {
      const subj = subjects.find(s => s.id === id);

      document.getElementById("editSubjectId").value = subj.id;
      document.getElementById("editSubjectNameInput").value = subj.name;
      document.getElementById("editSubjectTopicsInput").value = subj.topics.join(", ");

      const modal = new bootstrap.Modal(document.getElementById("editSubjectModal"));
      modal.show();
  }


  // UPDATE SUBJECT
  document.getElementById("updateSubjectBtn").addEventListener("click", function () {
      const id = Number(document.getElementById("editSubjectId").value);
      const name = document.getElementById("editSubjectNameInput").value.trim();
      const topics = document.getElementById("editSubjectTopicsInput").value.trim().split(",");

      const subj = subjects.find(s => s.id === id);
      subj.name = name;
      subj.topics = topics.map(t => t.trim());

      renderSubjects();

      const modal = bootstrap.Modal.getInstance(document.getElementById("editSubjectModal"));
      modal.hide();

      console.log("UPDATE → send PUT request to backend here");
  });


  // DELETE SUBJECT
  function deleteSubject(id) {
      if (!confirm("Are you sure you want to delete this subject?")) return;

      subjects = subjects.filter(s => s.id !== id);

      renderSubjects();

      console.log("DELETE → send DELETE request to backend here");
  }

  function searchSubjects() {
    const query = document.getElementById("searchInput").value.trim().toLowerCase();
    const resultDiv = document.getElementById("searchResults");

    if (query === "") {
        resultDiv.innerHTML = "";
        return;
    }

    let results = [];

    subjects.forEach(sub => {
        // Match subject name
        if (sub.name.toLowerCase().includes(query)) {
            results.push({
                subject: sub.name,
                topic: "(Subject name matches)"
            });
        }

        // Match topics inside the subject
        sub.topics.forEach(topic => {
            if (topic.toLowerCase().includes(query)) {
                results.push({
                    subject: sub.name,
                    topic: topic
                });
            }
        });
    });

    // Clear previous results
    resultDiv.innerHTML = "";

    // If no match
    if (results.length === 0) {
        resultDiv.innerHTML = `
            <div class="alert alert-danger mt-2">
                No subjects or topics found for "<strong>${query}</strong>"
            </div>
        `;
        return;
    }

    // Display matches
    let html = `
        <div class="alert alert-info mt-2">
            <strong>Search Results:</strong>
            <ul class="mt-2">
                ${results
                    .map(
                        r =>
                            `<li><strong>${r.subject}:</strong> ${r.topic}</li>`
                    )
                    .join("")}
            </ul>
        </div>
    `;

    resultDiv.innerHTML = html;
}

</script>

  </body>
</html>
