<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathfinder AI - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <header class="py-3 mb-4 mr-0 border-bottom">
        <div class="container d-flex justify-content-between align-items-center">
            <!-- Updated image to a simpler placeholder or local asset if needed -->
            <img src="https://static.wixstatic.com/media/762f9e_d26e24c53dea4f009be9f9c8ca77ba02~mv2.png/v1/fill/w_250,h_250,al_c/762f9e_d26e24c53dea4f009be9f9c8ca77ba02~mv2.png" alt="Pathfinder AI Logo" style="height: 50px; width: auto;">
            <div>
                <button class="btn btn-outline-primary me-2">Login</button>
                <a href="signup.html"><button class="btn btn-primary">Sign-up</button></a>
            </div>
        </div>
    </header>

    <section class="form-login">
        <form onsubmit="handleLogin(event)">
            <h1 class="text-center mb-4">Login</h1> 

            <div class="mb-3">
                <label for="username" class="form-label">Email address</label>
                <input type="email" class="form-control" id="username" aria-describedby="emailHelp" required>
                <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="remember-check">
                <label class="form-check-label" for="remember-check">Remember me!</label>
            </div>

            <div class="mb-3 text-center" id="signuplnk"> 
                <a href="signup.html">New User? Sign Up here!</a> 
            </div>
            
            <div class="text-center">
                <button type="submit" class="btn btn-primary w-100">Submit</button>
            </div>
        </form>
    </section>

    <!-- BOOTSTRAP SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" xintegrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" xintegrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

    <!-- YOUR CUSTOM LOGIN LOGIC -->
    <script>
        async function handleLogin(event) {
            // 1. Stop the page from reloading (default form behavior)
            event.preventDefault(); 

            // 2. Get the data from the input boxes
            const email = document.getElementById('username').value; 
            const password = document.getElementById('password').value;

            // 3. Send the data to your Python Backend
            try {
                // Using 127.0.0.1 to match your backend config
                const response = await fetch(`http://127.0.0.1:8000/login?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    // 👇 CRITICAL FIX: This tells the browser to send/save the session cookie.
                    credentials: 'include'
                });

                const data = await response.json();

                if (response.ok) {
                    // Success!
                    alert("Login Successful: " + data.message);
                    // Redirect to the dashboard
                    window.location.href = "home.html"; 
                } else {
                    // Fail (Wrong password, etc.)
                    alert("Error: " + data.detail);
                }
            } catch (error) {
                // Network Error (Server is off)
                console.error("Connection failed", error);
                alert("Backend is offline! Make sure uvicorn is running.");
            }
        }
    </script>
</body>
</html>
