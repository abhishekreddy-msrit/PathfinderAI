<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <header class="py-3 mb-4 mr-0 border-bottom">
    <div class="container d-flex justify-content-between align-items-center">
        <img src="https://www.bing.com/images/search?view=detailV2&ccid=LGOy9T9d&id=549B00740A54EE3C18E5A76101020DA86AA7B4A5&thid=OIP.LGOy9T9dKF0KUgbPQdcDlQAAAA&mediaurl=https%3a%2f%2fstatic.wixstatic.com%2fmedia%2f762f9e_d26e24c53dea4f009be9f9c8ca77ba02%7emv2.png%2fv1%2ffill%2fw_250%2ch_250%2cal_c%2f762f9e_d26e24c53dea4f009be9f9c8ca77ba02%7emv2.png&exph=250&expw=250&q=pathfinder+ai+demo+logo&FORM=IRPRST&ck=0AA2B9DF33C1D16C2483EC4CF96A55D3&selectedIndex=3&itb=0">
        <div>
            <button class="btn btn-outline-primary me-2">Login</button>
            <a href="signup.html"><button class="btn btn-primary">Sign-up</button></a>
        </div>
    </div>
</header>


    <section class="form-login">
        <form>
            <h1 class="text-center mb-4">Login</h1> 

            <div class="mb-3">
                <label for="username" class="form-label">Email address</label>
                <input type="email" class="form-control" id="username" aria-describedby="emailHelp">
                <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password">
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="remember-check">
                <label class="form-check-label" for="remember-check">Remember me!</label>
            </div>

            <div class="mb-3 text-center" id="signuplnk"> 
                <a href="signup.html">New User? Sign Up here!</a> 
            </div>
            
            <div class="text-center">
                <button type="submit" class="btn btn-primary w-100">Submit</button>
            </div>
        </form>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
