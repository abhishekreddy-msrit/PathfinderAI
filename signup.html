<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <header class="py-3 mb-4 mr-0 border-bottom">
    <div class="container d-flex justify-content-between align-items-center">
        <img src="https://www.bing.com/images/search?view=detailV2&ccid=LGOy9T9d&id=549B00740A54EE3C18E5A76101020DA86AA7B4A5&thid=OIP.LGOy9T9dKF0KUgbPQdcDlQAAAA&mediaurl=https%3a%2f%2fstatic.wixstatic.com%2fmedia%2f762f9e_d26e24c53dea4f009be9f9c8ca77ba02%7emv2.png%2fv1%2ffill%2fw_250%2ch_250%2cal_c%2f762f9e_d26e24c53dea4f009be9f9c8ca77ba02%7emv2.png&exph=250&expw=250&q=pathfinder+ai+demo+logo&FORM=IRPRST&ck=0AA2B9DF33C1D16C2483EC4CF96A55D3&selectedIndex=3&itb=0">
        <div>
            <a href="login.html"><button class="btn btn-primary">Login</button></a>
            <button class="btn btn-outline-primary me-2">Sign-up</button>
        </div>
    </div>
</header>
    <section class="form-signup">
        <form>
            <h1 class="text-center mb-4">Sign Up</h1>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" placeholder="Enter your full name">
            </div>

            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" class="form-control" placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Create a password">
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control" placeholder="Re-enter password">
            </div>

            <div class="text-center mb-3">
                <a href="login.html">Already have an account? Login here!</a>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary w-100">Create Account</button>
            </div>
        </form>
    </section>

</body>
</html>
